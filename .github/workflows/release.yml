# Cut a release: push a version mark - an annotated two-component tag vMAJOR.MINOR on a commit of main - and the engine
# and the GUIs are built and tested on Linux, Windows and macOS (Apple silicon), signed, each checked to report the
# version, then published as GitHub release vMAJOR.MINOR.0. Run it by hand (workflow_dispatch) on main to release main's
# head as vMAJOR.MINOR.BUILD. The version is Directory.Build.targets' rule, so the release and the binaries agree by
# construction: MAJOR.MINOR from the nearest vMAJOR.MINOR tag, BUILD the commits since it. The workflow creates the
# three-component tag itself; only two-component tags are version marks. A version already released is refused.
#
# A dry run (workflow_dispatch with dry_run, from any branch) builds, tests, signs and notarises the macOS files - which
# costs nothing - and publishes nothing; it leaves the Windows files unsigned, since every eSigner signing spends the
# SSL.com account's allowance. With no vMAJOR.MINOR tag reachable a dry run carries on as 0.0.0 (the build's fallback);
# a publishing run refuses.
#
# The organisation's other apps (vst-plugins, ir-capture) and the other chess engines are released the same way, with
# the same organisation secrets for signing:
#   - Windows: the engine and the GUI (the Avalonia app, as on macOS and Linux) are Authenticode-signed through
#     SSL.com's eSigner (CodeSignTool pinned by version and hash, in the runner's tool cache; tools/sign-windows.ps1),
#     the account checked before the build, which spends no signing. Only a publishing run signs, and only the two files
#     it ships.
#   - macOS: the engine and "Stoopid Chess.app" (the Avalonia GUI, its native libraries beside its executable) are
#     signed with the Developer ID Application identity, the hardened runtime, a secure timestamp and the one
#     entitlement .NET's JIT needs (packaging/macos/entitlements.plist), on a keychain of the job's own
#     (tools/sign-macos.sh), and notarised. The app's ticket is stapled to it, so it opens from Finder offline; a bare
#     engine binary can carry no ticket, so Gatekeeper finds the engine's online.
#   A publishing run that would ship anything unsigned fails instead.
#
# The files: stoopid-chess-<version>-linux-x86_64, -windows-x86_64.exe and -macos-arm64.zip (the engine);
# stoopid-chess-gui-<version>-linux-x86_64 and -windows-x86_64.exe (the Avalonia GUI, its native libraries inside the
# single file) and -macos-arm64.zip ("Stoopid Chess.app"); and the source as stoopid-chess-<version>-source.tar.gz.
# The Windows GUI was the Windows Forms one up to 3.0.0; the Avalonia app replaced it, and the Windows Forms GUI is gone.
# Before 3.0 the macOS and Linux GUIs shipped without the native libraries Avalonia loads and did not start; each GUI is
# now started for ten seconds before it ships (on Windows, whose runner has no interactive desktop, by the app's own
# --smoke). verify opens the release as a draft and each job uploads straight onto it; publish makes the source (in a
# dry run too), checks all seven files are on the draft, pushes the tag and takes the draft public. A failed job can be
# run again; a run that fails before it publishes leaves only a draft, which the next run replaces.
#
# Every job runs on the organisation's self-hosted runners, never a hosted image, and never for a pull request: this
# workflow holds the signing secrets.
name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and sign the macOS files only; publish nothing (the Windows files unsigned)"
        type: boolean
        default: false

permissions:
  contents: write # the draft, the tag and the release

# One release at a time: a tag push and a dispatch at once would each replace and publish drafts under the other. A run
# waits for the one in progress rather than cancel it, which could leave a half-uploaded draft behind.
concurrency:
  group: release
  cancel-in-progress: false

# No telemetry from the SDK, and no first-run banner in the logs.
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  verify:
    name: version and commit
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      release_id: ${{ steps.version.outputs.release_id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tags and the commits since the nearest one are the version
          fetch-tags: true
      - name: The version from the tags, the commit on main, and the draft
        id: version
        shell: bash
        run: |
          set -euo pipefail
          is_dry_run=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            is_dry_run=true
          fi
          if [ "${{ github.ref_type }}" = "tag" ] && ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a version mark vMAJOR.MINOR; the three-component release tags are made by this workflow"
            exit 1
          fi
          # main and nowhere else, but for a dry run, which publishes nothing and may prove a change to the release
          # from its branch before it merges.
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "$is_dry_run" = false ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::a release is cut from main, not $GITHUB_REF"
              exit 1
            fi
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
              { echo "::error::$GITHUB_SHA is not on main: tag a commit of main"; exit 1; }
          fi
          describe=$(git describe --tags --long --match 'v[0-9]*.[0-9]*' --exclude 'v*.*.*' 2> /dev/null || true)
          if [[ "$describe" =~ ^v([0-9]+)\.([0-9]+)-([0-9]+)-g[0-9a-f]+$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          elif [ "$is_dry_run" = true ]; then
            echo "::warning::no vMAJOR.MINOR tag is reachable from $GITHUB_SHA: a dry run as 0.0.0, the build's fallback"
            version=0.0.0
          else
            echo "::error::no vMAJOR.MINOR tag is reachable from $GITHUB_SHA (git describe: '$describe'): tag main and push the tag"
            exit 1
          fi
          tag="v$version"
          publish=true
          [ "$is_dry_run" = true ] && publish=false
          release_id=""
          if [ "$publish" = true ]; then
            if is_draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null); then
              if [ "$is_draft" = true ]; then
                echo "A draft of $tag is left from a run that did not publish; replacing it"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
              else
                echo "::error::$tag is already released: push a commit (the build number moves on) or tag the next vMAJOR.MINOR"
                exit 1
              fi
            fi
            changes=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$tag" \
              -f target_commitish="$GITHUB_SHA" --jq .body)
            {
              echo "Stoopid Chess $version: a C# UCI chess engine with a hand-written evaluation, and a GUI to play it or any"
              echo "UCI engine; built and tested at commit \`$GITHUB_SHA\` by run"
              echo "[#$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
              echo
              echo "- **Windows (x86-64):** the engine \`stoopid-chess-$version-windows-x86_64.exe\` and the GUI"
              echo "  \`stoopid-chess-gui-$version-windows-x86_64.exe\`, both Authenticode-signed (Jonathan Reckless)."
              echo "- **macOS (Apple silicon):** the engine in \`stoopid-chess-$version-macos-arm64.zip\` and the app,"
              echo "  \`Stoopid Chess.app\`, in \`stoopid-chess-gui-$version-macos-arm64.zip\`; both signed with a Developer ID and"
              echo "  notarised by Apple."
              echo "- **Linux (x86-64):** the engine \`stoopid-chess-$version-linux-x86_64\` and the GUI"
              echo "  \`stoopid-chess-gui-$version-linux-x86_64\`; \`chmod +x\` them."
              echo
              echo "$changes"
            } > "$RUNNER_TEMP/notes.md"
            # The REST API's answer carries the draft's numeric id, which the build jobs upload to: a draft has no tag
            # to be found by.
            release_id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$tag" \
              -f target_commitish="$GITHUB_SHA" -f name="Stoopid Chess $version" -F draft=true \
              -F body=@"$RUNNER_TEMP/notes.md" --jq .id)
            echo "draft release $tag opened: id $release_id"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "release_id=$release_id"
          } >> "$GITHUB_OUTPUT"
          echo "Stoopid Chess $version (git describe: ${describe:-none}); publish=$publish"
  # Linux: the engine and the Avalonia GUI, every gate CI runs (the suite, perft 3, the bench signature), and the GUI
  # started under Xvfb.
  linux:
    name: build + test (linux x86_64)
    needs: verify
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PUBLISH: ${{ needs.verify.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Directory.Build.targets reads the version from the tags
          fetch-tags: true
      - name: Start from nothing
        run: rm -rf publish out
      # As in ci.yml: setup-dotnet's default install root is not writable by the runner's service account.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
      - name: Build engine
        run: dotnet build src/StoopidChess.Uci/StoopidChess.Uci.csproj -c Release
      - name: Build Avalonia GUI
        run: dotnet build src/StoopidChess.Desktop/StoopidChess.Desktop.csproj -c Release
      - name: Test
        run: dotnet test tests/StoopidChess.Tests/StoopidChess.Tests.csproj -c Release
      - name: Perft (full standard set, depths up to 3M nodes)
        run: dotnet run --project src/StoopidChess.Uci -c Release --no-build -- perft 3
      - name: Bench signature
        run: dotnet run --project src/StoopidChess.Uci -c Release --no-build -- bench
      # The GUI's native libraries (SkiaSharp, HarfBuzzSharp) go inside its single file, extracted at its first start:
      # a single-file publish otherwise leaves them beside it, where a lone download has none.
      - name: Publish
        run: |
          dotnet publish src/StoopidChess.Uci/StoopidChess.Uci.csproj -c Release -r linux-x64 --self-contained \
            -p:PublishSingleFile=true -o publish/engine
          dotnet publish src/StoopidChess.Desktop/StoopidChess.Desktop.csproj -c Release -r linux-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/desktop
          mkdir -p out
          cp publish/engine/stoopid-chess "out/stoopid-chess-$VERSION-linux-x86_64"
          cp publish/desktop/StoopidChess.Desktop "out/stoopid-chess-gui-$VERSION-linux-x86_64"
          ls -l out
      - name: The shipped files report the version, and the GUI starts on its own
        run: |
          set -o pipefail
          name=$(printf 'uci\nquit\n' | "out/stoopid-chess-$VERSION-linux-x86_64" | grep -m1 '^id name' || true)
          echo "$name"
          [ "$name" = "id name Stoopid Chess $VERSION" ] || { echo "::error::the engine says '$name'"; exit 1; }
          said=$("out/stoopid-chess-gui-$VERSION-linux-x86_64" --version)
          echo "$said"
          [ "$said" = "Stoopid Chess $VERSION" ] || { echo "::error::the GUI says '$said'"; exit 1; }
          # Alone in a folder of its own, as a download is, on Xvfb's display: still running after ten seconds.
          command -v xvfb-run > /dev/null || { echo "::error::xvfb-run is not on the runner's PATH"; exit 1; }
          lone="$RUNNER_TEMP/lone-gui" && rm -rf "$lone" && mkdir "$lone"
          cp "out/stoopid-chess-gui-$VERSION-linux-x86_64" "$lone/"
          xvfb-run -a "$lone/stoopid-chess-gui-$VERSION-linux-x86_64" > "$RUNNER_TEMP/gui.log" 2>&1 &
          runner=$!
          sleep 10
          if ! pgrep -f "[l]one-gui/stoopid-chess-gui" > /dev/null; then
            cat "$RUNNER_TEMP/gui.log"
            echo "::error::the GUI did not keep running"
            exit 1
          fi
          pkill -f "[l]one-gui/stoopid-chess-gui" || true
          wait "$runner" || true
          rm -rf "$lone"
          echo "the GUI ran for ten seconds"
      - name: Upload to the draft release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.verify.outputs.release_id }}
        run: |
          set -o pipefail
          for file in out/*; do
            name=$(basename "$file")
            # A file of the same name an earlier attempt left on the draft is replaced, so the job can run again (where the
            # runner has gh; a first attempt needs no removal).
            command -v gh > /dev/null || echo "no gh here: a file an earlier attempt left would stop this upload"
            for stale in $(command -v gh > /dev/null && gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq ".[] | select(.name == \"$name\") | .id"); do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$stale"
            done
            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" --data-binary "@$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" |
              grep -o '"browser_download_url": *"[^"]*"'
          done
      - uses: actions/upload-artifact@v6
        if: env.PUBLISH != 'true'
        continue-on-error: true
        with:
          name: linux
          path: out/*
          retention-days: 1
      - name: The workspace left clean
        if: always()
        run: rm -rf publish out

  # Windows: the solution and the suite, as CI builds them, and the engine's perft and bench; the engine and the Avalonia
  # GUI published as single files and, in a publishing run, signed.
  windows:
    name: build + test (windows x86_64)
    needs: verify
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PUBLISH: ${{ needs.verify.outputs.publish }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Directory.Build.targets reads the version from the tags
          fetch-tags: true
      - name: Start from nothing
        run: rm -rf publish out
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.x
      # SSL.com's CodeSignTool, pinned by version and hash and kept in the tool cache, and the account signed in to and
      # its certificate listed - which spends no signing - before the build rides on it.
      - name: eSigner's signing tool, and the account checked
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
        run: |
          if (-not $env:ESIGNER_USERNAME) { throw "no eSigner secrets: a release's Windows files are signed" }
          $version = 'v1.3.2'
          $sha256 = '4afc32e8b7f79bbe1de7e4e7049aaad4e0f754357613b9bbec0e3052f06fd36b'
          $dir = Join-Path $env:RUNNER_TOOL_CACHE "codesigntool\$version"
          if (-not (Test-Path (Join-Path $dir 'CodeSignTool.bat'))) {
            $zip = Join-Path $env:RUNNER_TEMP 'codesigntool.zip'
            Invoke-WebRequest -UseBasicParsing -OutFile $zip `
              -Uri "https://github.com/SSLcom/CodeSignTool/releases/download/$version/CodeSignTool-$version-windows.zip"
            $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
            if ($hash -ne $sha256) { throw "CodeSignTool $version is $hash, not the pinned $sha256" }
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $dir
            Expand-Archive -Path $zip -DestinationPath $dir
            Remove-Item -Force $zip
          }
          "RECKLESS_CODESIGNTOOL=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $env:RECKLESS_CODESIGNTOOL = $dir
          pwsh -NoProfile -File tools/sign-windows.ps1 -Check
          if ($LASTEXITCODE -ne 0) { throw "the eSigner account is not ready to sign" }
      - name: Build solution
        run: dotnet build StoopidChess.slnx -c Release
      - name: Test
        run: dotnet test tests/StoopidChess.Tests/StoopidChess.Tests.csproj -c Release --no-build
      - name: Perft and the bench signature
        run: |
          dotnet run --project src/StoopidChess.Uci -c Release --no-build -- perft 3
          dotnet run --project src/StoopidChess.Uci -c Release --no-build -- bench
      # The GUI's native libraries (SkiaSharp, HarfBuzzSharp, ANGLE) go inside its single file, as on Linux, extracted
      # at its first start: one .exe to download, and to sign.
      - name: Publish
        run: |
          dotnet publish src/StoopidChess.Uci/StoopidChess.Uci.csproj -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -o publish/engine
          dotnet publish src/StoopidChess.Desktop/StoopidChess.Desktop.csproj -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/desktop
          ls -l publish/desktop
          beside=""
          for file in publish/desktop/*; do
            case "$(basename "$file")" in StoopidChess.Desktop.exe | *.pdb) ;; *) beside="$beside $file" ;; esac
          done
          [ -z "$beside" ] || { echo "::error::the GUI's publish left files beside it, which a lone .exe lacks:$beside"; exit 1; }
          mkdir -p out
          cp publish/engine/stoopid-chess.exe "out/stoopid-chess-$VERSION-windows-x86_64.exe"
          cp publish/desktop/StoopidChess.Desktop.exe "out/stoopid-chess-gui-$VERSION-windows-x86_64.exe"
          ls -l out
      - name: Sign (a publishing run)
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
        run: |
          pwsh -NoProfile -File tools/sign-windows.ps1 "out/stoopid-chess-$env:VERSION-windows-x86_64.exe" `
            "out/stoopid-chess-gui-$env:VERSION-windows-x86_64.exe"
          if ($LASTEXITCODE -ne 0) { throw "the Windows files were not signed" }
      # The engine answers over UCI. The GUI answers --version, and its version resource (what Explorer shows) must
      # agree. Then it is started, alone in a folder of its own as a download is, by --smoke: the runner is a service
      # with no interactive desktop, so no one could see a window, nor a dialog an app that died would leave open. The
      # app opens its main window as usual, says so, quits itself ten seconds later and exits 0; anything else fails.
      # A GUI-subsystem .exe has no console of its own, so each is run with its output redirected, and waited for.
      - name: The shipped files report the version, the GUI starts on its own, and they are signed where they must be
        shell: pwsh
        run: |
          function Invoke-Gui([string] $exe, [string] $argument, [int] $timeoutSeconds) {
            $start = [System.Diagnostics.ProcessStartInfo]::new($exe, $argument)
            $start.UseShellExecute = $false
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $start.WorkingDirectory = Split-Path -Parent $exe
            $process = [System.Diagnostics.Process]::Start($start)
            $output = $process.StandardOutput.ReadToEndAsync()
            $errors = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit($timeoutSeconds * 1000)) {
              $process.Kill($true)
              throw "$exe $argument was still running after $timeoutSeconds seconds"
            }
            $process.WaitForExit()
            [pscustomobject] @{ ExitCode = $process.ExitCode; Output = $output.Result.Trim(); Errors = $errors.Result.Trim() }
          }
          $engine = "out/stoopid-chess-$env:VERSION-windows-x86_64.exe"
          $gui = "out/stoopid-chess-gui-$env:VERSION-windows-x86_64.exe"
          $name = ("uci`nquit`n" | & $engine | Select-String -Pattern '^id name' | Select-Object -First 1).Line
          "engine: $name"
          if ($name -ne "id name Stoopid Chess $env:VERSION") { throw "the engine says '$name'" }
          $said = Invoke-Gui (Resolve-Path $gui).Path '--version' 60
          "GUI: $($said.Output)"
          if ($said.ExitCode -ne 0 -or $said.Output -ne "Stoopid Chess $env:VERSION") {
            throw "the GUI says '$($said.Output)' $($said.Errors), exit code $($said.ExitCode)"
          }
          $info = (Get-Item $gui).VersionInfo
          "GUI's version resource: $($info.ProductName) $($info.ProductVersion), file $($info.FileVersion)"
          if ($info.ProductVersion.Split('+')[0] -ne $env:VERSION) { throw "the GUI's version resource says $($info.ProductVersion)" }
          $lone = Join-Path $env:RUNNER_TEMP 'lone-gui'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $lone
          New-Item -ItemType Directory $lone | Out-Null
          Copy-Item $gui $lone
          $smoke = Invoke-Gui (Join-Path $lone (Split-Path -Leaf $gui)) '--smoke' 120
          $smoke.Output
          if ($smoke.Errors) { $smoke.Errors }
          if ($smoke.ExitCode -ne 0 -or $smoke.Output -notmatch 'the main window is open' -or $smoke.Output -notmatch 'ran for 10 seconds') {
            throw "the GUI did not run for ten seconds (exit code $($smoke.ExitCode))"
          }
          Remove-Item -Recurse -Force $lone
          "the GUI ran for ten seconds"
          if ($env:PUBLISH -eq 'true') {
            foreach ($file in $engine, $gui) {
              $signature = Get-AuthenticodeSignature -FilePath $file
              "$file : $($signature.Status), $($signature.SignerCertificate.Subject)"
              if ($signature.Status -ne 'Valid') { throw "$file is not validly signed: $($signature.StatusMessage)" }
            }
          }
      # What a person typing the command sees: --version and --smoke run from cmd.exe in a pseudoconsole (ConPTY, as
      # Windows Terminal hosts a shell), whose screen must show their lines, and "--version > file" fill the file. The
      # GUI, a GUI-subsystem .exe, attaches to its parent's console for them (src/StoopidChess.Desktop/WindowsConsole.cs).
      - name: The GUI prints into a command prompt
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/check-windows-console.ps1 -Gui "out/stoopid-chess-gui-$env:VERSION-windows-x86_64.exe" `
            -Version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "the GUI does not print into a command prompt" }
      - name: Upload to the draft release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.verify.outputs.release_id }}
        run: |
          set -o pipefail
          for file in out/*; do
            name=$(basename "$file")
            # A file of the same name an earlier attempt left on the draft is replaced, so the job can run again (where the
            # runner has gh; a first attempt needs no removal).
            command -v gh > /dev/null || echo "no gh here: a file an earlier attempt left would stop this upload"
            for stale in $(command -v gh > /dev/null && gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq ".[] | select(.name == \"$name\") | .id"); do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$stale"
            done
            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" --data-binary "@$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" |
              grep -o '"browser_download_url": *"[^"]*"'
          done
      - uses: actions/upload-artifact@v6
        if: env.PUBLISH != 'true'
        continue-on-error: true
        with:
          name: windows
          path: out/*
          retention-days: 1
      - name: The workspace left clean
        if: always()
        run: rm -rf publish out

  # macOS (Apple silicon): every gate, the engine and "Stoopid Chess.app" signed, notarised (the app stapled) and
  # started before they ship.
  macos:
    name: build + test (macos arm64)
    needs: verify
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 240 # Apple's notary service
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PUBLISH: ${{ needs.verify.outputs.publish }}
      APP: Stoopid Chess.app
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Directory.Build.targets reads the version from the tags
          fetch-tags: true
      - name: Start from nothing
        run: rm -rf publish out stage
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build engine
        run: dotnet build src/StoopidChess.Uci/StoopidChess.Uci.csproj -c Release
      - name: Build Avalonia GUI
        run: dotnet build src/StoopidChess.Desktop/StoopidChess.Desktop.csproj -c Release
      - name: Test
        run: dotnet test tests/StoopidChess.Tests/StoopidChess.Tests.csproj -c Release
      - name: Perft (full standard set, depths up to 3M nodes)
        run: dotnet run --project src/StoopidChess.Uci -c Release --no-build -- perft 3
      - name: Bench signature
        run: dotnet run --project src/StoopidChess.Uci -c Release --no-build -- bench
      # The app: the GUI's single-file executable and the native libraries Avalonia loads beside it in Contents/MacOS,
      # its icon (packaging/macos/StoopidChess.icns, which tools/make-icons.py draws from packaging/icon/BlackQueen.svg)
      # and packaging/macos/Info.plist at the version.
      - name: Publish, and the app assembled
        run: |
          dotnet publish src/StoopidChess.Uci/StoopidChess.Uci.csproj -c Release -r osx-arm64 --self-contained \
            -p:PublishSingleFile=true -o publish/engine
          dotnet publish src/StoopidChess.Desktop/StoopidChess.Desktop.csproj -c Release -r osx-arm64 --self-contained \
            -p:PublishSingleFile=true -o publish/desktop
          mkdir -p "stage/engine" "stage/$APP/Contents/MacOS" "stage/$APP/Contents/Resources"
          cp publish/engine/stoopid-chess "stage/engine/stoopid-chess-$VERSION-macos-arm64"
          cp publish/desktop/StoopidChess.Desktop publish/desktop/*.dylib "stage/$APP/Contents/MacOS/"
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "stage/$APP/Contents/Info.plist"
          plutil -lint "stage/$APP/Contents/Info.plist"
          cp packaging/macos/StoopidChess.icns "stage/$APP/Contents/Resources/StoopidChess.icns"
          find stage -type f | sort
      - name: Open the signing keychain
        env:
          MACOS_DEVELOPER_ID_APPLICATION_P12: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: tools/sign-macos.sh open
      - name: Sign, notarise and staple
        env:
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          engine="stage/engine/stoopid-chess-$VERSION-macos-arm64"
          tools/sign-macos.sh sign --identifier com.recklesstechnology.stoopid-chess.engine \
            --entitlements packaging/macos/entitlements.plist "$engine"
          tools/sign-macos.sh sign --entitlements packaging/macos/entitlements.plist "stage/$APP"
          mkdir -p out
          # ditto, as Finder makes a zip: the executable bits, the bundle and the signatures come out as they went in.
          ditto -c -k "$engine" "out/stoopid-chess-$VERSION-macos-arm64.zip"
          ditto -c -k --keepParent "stage/$APP" "$RUNNER_TEMP/app-to-notarise.zip"
          tools/sign-macos.sh notarize "out/stoopid-chess-$VERSION-macos-arm64.zip"
          tools/sign-macos.sh notarize "$RUNNER_TEMP/app-to-notarise.zip"
          # The app's ticket stapled to it, then zipped again: what ships opens from Finder with no network.
          xcrun stapler staple "stage/$APP"
          xcrun stapler validate "stage/$APP"
          ditto -c -k --keepParent "stage/$APP" "out/stoopid-chess-gui-$VERSION-macos-arm64.zip"
          rm -f "$RUNNER_TEMP/app-to-notarise.zip"
          tools/sign-macos.sh check "$engine" "stage/$APP"
          ls -l out
      # What ships is what is checked: the engine and the app as their zips hold them, the app also started as Finder
      # would, from a folder of its own.
      - name: The shipped files report the version, and the app starts
        run: |
          set -o pipefail
          unzipped="$RUNNER_TEMP/unzipped" && rm -rf "$unzipped" && mkdir "$unzipped"
          ditto -x -k "out/stoopid-chess-$VERSION-macos-arm64.zip" "$unzipped"
          ditto -x -k "out/stoopid-chess-gui-$VERSION-macos-arm64.zip" "$unzipped"
          find "$unzipped" -maxdepth 4 | sort
          codesign --verify --strict --verbose=2 "$unzipped/stoopid-chess-$VERSION-macos-arm64"
          codesign --verify --deep --strict --verbose=2 "$unzipped/$APP"
          xcrun stapler validate "$unzipped/$APP"
          name=$(printf 'uci\nquit\n' | "$unzipped/stoopid-chess-$VERSION-macos-arm64" | grep -m1 '^id name' || true)
          echo "$name"
          [ "$name" = "id name Stoopid Chess $VERSION" ] || { echo "::error::the engine says '$name'"; exit 1; }
          plist=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$unzipped/$APP/Contents/Info.plist")
          said=$("$unzipped/$APP/Contents/MacOS/StoopidChess.Desktop" --version)
          echo "Info.plist: $plist; the GUI: $said"
          [ "$plist" = "$VERSION" ] && [ "$said" = "Stoopid Chess $VERSION" ] || { echo "::error::the app is not at $VERSION"; exit 1; }
          "$unzipped/$APP/Contents/MacOS/StoopidChess.Desktop" > "$RUNNER_TEMP/gui.log" 2>&1 &
          gui=$!
          sleep 10
          if ! kill -0 "$gui" 2> /dev/null; then
            cat "$RUNNER_TEMP/gui.log"
            echo "::error::the app did not keep running"
            exit 1
          fi
          kill "$gui"
          echo "the app ran for ten seconds"
      - name: Upload to the draft release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.verify.outputs.release_id }}
        run: |
          set -o pipefail
          for file in out/*; do
            name=$(basename "$file")
            # A file of the same name an earlier attempt left on the draft is replaced, so the job can run again (where the
            # runner has gh; a first attempt needs no removal).
            command -v gh > /dev/null || echo "no gh here: a file an earlier attempt left would stop this upload"
            for stale in $(command -v gh > /dev/null && gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq ".[] | select(.name == \"$name\") | .id"); do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$stale"
            done
            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" --data-binary "@$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" |
              grep -o '"browser_download_url": *"[^"]*"'
          done
      - uses: actions/upload-artifact@v6
        if: env.PUBLISH != 'true'
        continue-on-error: true
        with:
          name: macos
          path: out/*
          retention-days: 1
      - name: Close the signing keychain
        if: always()
        run: tools/sign-macos.sh close
      - name: The workspace left clean
        if: always()
        run: rm -rf publish out stage "$RUNNER_TEMP/unzipped"

  # The source, made in a dry run too; then, in a publishing run, the draft checked and published. Every step is safe
  # to run again: an upload replaces a file of the same name an earlier attempt left on the draft, and a tag an earlier
  # attempt pushed is taken as it stands when it names this commit.
  publish:
    name: source, publish
    needs: [verify, linux, windows, macos]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ needs.verify.outputs.tag }}
      PUBLISH: ${{ needs.verify.outputs.publish }}
      RELEASE_ID: ${{ needs.verify.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: The source
        run: |
          set -euo pipefail
          rm -rf out && mkdir out
          git archive --format=tar.gz --prefix="stoopid-chess-$VERSION/" -o "out/stoopid-chess-$VERSION-source.tar.gz" "$GITHUB_SHA"
          ls -l out
      - name: Upload to the draft release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.verify.outputs.release_id }}
        run: |
          set -o pipefail
          for file in out/*; do
            name=$(basename "$file")
            # A file of the same name an earlier attempt left on the draft is replaced, so the job can run again (where the
            # runner has gh; a first attempt needs no removal).
            command -v gh > /dev/null || echo "no gh here: a file an earlier attempt left would stop this upload"
            for stale in $(command -v gh > /dev/null && gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq ".[] | select(.name == \"$name\") | .id"); do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$stale"
            done
            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" --data-binary "@$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" |
              grep -o '"browser_download_url": *"[^"]*"'
          done
      - name: Publish the release
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          release="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          draft_tag=$(gh api "$release" --jq .tag_name)
          [ "$draft_tag" = "$TAG" ] || { echo "::error::the draft (id $RELEASE_ID) is for $draft_tag, not $TAG"; exit 1; }
          assets=$(gh api "$release" --jq '.assets[].name')
          missing=""
          for file in "stoopid-chess-$VERSION-linux-x86_64" "stoopid-chess-gui-$VERSION-linux-x86_64" \
                      "stoopid-chess-$VERSION-windows-x86_64.exe" "stoopid-chess-gui-$VERSION-windows-x86_64.exe" \
                      "stoopid-chess-$VERSION-macos-arm64.zip" "stoopid-chess-gui-$VERSION-macos-arm64.zip" \
                      "stoopid-chess-$VERSION-source.tar.gz"; do
            grep -qx "$file" <<< "$assets" || { echo "::error::$file is not on the draft $TAG"; missing="$missing $file"; }
          done
          [ -z "$missing" ] || exit 1
          # The release's own tag on the commit built, made with git and pushed. The tagger is named on the command
          # alone: the runner keeps this clone, and an identity written into its config would outlive the job.
          git tag -d "$TAG" > /dev/null 2>&1 || true
          if git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG" 2> /dev/null; then
            [ "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA" ] ||
              { echo "::error::$TAG already names another commit than $GITHUB_SHA"; exit 1; }
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$TAG" "$GITHUB_SHA" -m "Stoopid Chess $VERSION"
            git push origin "$TAG"
          fi
          gh api -X PATCH "$release" -F draft=false -f make_latest=true --jq .html_url
          gh api "$release" --jq '.assets[] | "  \(.name)  \(.size) bytes"'
          echo "### Released [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
      - name: The workspace left clean
        if: always()
        run: rm -rf out
