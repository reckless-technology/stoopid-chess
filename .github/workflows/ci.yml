name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The engine and its tests are cross-platform; the GUI is Windows only. Linux gates the engine
  # cheaply on every push, Windows builds everything and produces the downloadable binaries.
  engine-linux:
    name: engine + tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build engine
        run: dotnet build src/StoopidChess.Uci/StoopidChess.Uci.csproj -c Release
      - name: Test
        run: dotnet test tests/StoopidChess.Tests/StoopidChess.Tests.csproj -c Release --logger "trx;LogFileName=results.trx"
      - name: Perft (full standard set, depths up to 3M nodes)
        run: dotnet run --project src/StoopidChess.Uci -c Release --no-build -- perft 3
      - name: Bench signature
        run: dotnet run --project src/StoopidChess.Uci -c Release --no-build -- bench

  windows:
    name: build + test + publish (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build solution
        run: dotnet build StoopidChess.slnx -c Release
      - name: Test
        run: dotnet test tests/StoopidChess.Tests/StoopidChess.Tests.csproj -c Release --no-build
      - name: Publish GUI
        run: dotnet publish src/StoopidChess.Gui/StoopidChess.Gui.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/gui
      - name: Publish engine
        run: dotnet publish src/StoopidChess.Uci/StoopidChess.Uci.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/engine
      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: stoopid-chess-win-x64
          path: |
            publish/gui/StoopidChess.exe
            publish/engine/stoopid-chess.exe
