name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The engine and the Avalonia GUI are cross-platform; the WinForms GUI is Windows only. Every job
  # uploads versioned, self-contained binaries as artifacts, for a look at a commit's build: releases
  # are built from nothing by release.yml on a pushed vMAJOR.MINOR tag, and signed. The artifacts are
  # kept a day (retention-days: 1): the organisation's artifact storage is one quota every repository
  # shares.
  engine-linux:
    name: engine + tests (linux)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0    # The full history and the tags: the version comes from them
      # setup-dotnet's default install root is /usr/share/dotnet on Linux and %PROGRAMFILES%\dotnet on
      # Windows, and the runner's service account can write to neither. Only macOS's default,
      # $HOME/.dotnet, happens to be writable — which is why the macos leg alone worked before these
      # jobs moved off the hosted images, where the runner is an administrator. runner.tool_cache is
      # writable and sits outside the workspace, so the SDK also survives between runs. This has to be
      # step-level env: the runner context is not available to a job-level env block.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
      - name: Build engine
        run: dotnet build src/StoopidChess.Uci/StoopidChess.Uci.csproj -c Release
      - name: Build Avalonia GUI
        run: dotnet build src/StoopidChess.Desktop/StoopidChess.Desktop.csproj -c Release
      - name: Test
        run: dotnet test tests/StoopidChess.Tests/StoopidChess.Tests.csproj -c Release --logger "trx;LogFileName=results.trx"
      - name: Perft (full standard set, depths up to 3M nodes)
        run: dotnet run --project src/StoopidChess.Uci -c Release --no-build -- perft 3
      - name: Bench signature
        run: dotnet run --project src/StoopidChess.Uci -c Release --no-build -- bench
      - name: Publish engine
        run: dotnet publish src/StoopidChess.Uci/StoopidChess.Uci.csproj -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o publish/engine
      - name: Publish Avalonia GUI
        # Its native libraries inside the single file, as release.yml publishes it: alone, it would not start.
        run: dotnet publish src/StoopidChess.Desktop/StoopidChess.Desktop.csproj -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/desktop
      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: stoopid-chess-linux-x64
          path: |
            publish/engine/stoopid-chess
            publish/desktop/StoopidChess.Desktop
          if-no-files-found: error
          retention-days: 1

  # The org's Apple-silicon runner (reckless-ci-mac-0; it replaced reckless-ci-mac-1 on 2026-09-27
  # and is now the only Mac in the pool, so every macos job in the organisation queues behind it)
  macos:
    name: engine + tests (macos arm64)
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build engine
        run: dotnet build src/StoopidChess.Uci/StoopidChess.Uci.csproj -c Release
      - name: Build Avalonia GUI
        run: dotnet build src/StoopidChess.Desktop/StoopidChess.Desktop.csproj -c Release
      - name: Test
        run: dotnet test tests/StoopidChess.Tests/StoopidChess.Tests.csproj -c Release
      - name: Perft (full standard set, depths up to 3M nodes)
        run: dotnet run --project src/StoopidChess.Uci -c Release --no-build -- perft 3
      - name: Bench signature
        run: dotnet run --project src/StoopidChess.Uci -c Release --no-build -- bench
      - name: Publish engine
        run: dotnet publish src/StoopidChess.Uci/StoopidChess.Uci.csproj -c Release -r osx-arm64 --self-contained -p:PublishSingleFile=true -o publish/engine
      - name: Publish Avalonia GUI
        run: dotnet publish src/StoopidChess.Desktop/StoopidChess.Desktop.csproj -c Release -r osx-arm64 --self-contained -p:PublishSingleFile=true -o publish/desktop
      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: stoopid-chess-macos-arm64
          # The GUI's native libraries beside it: alone, it would not start (release.yml ships them in an app).
          path: |
            publish/engine/stoopid-chess
            publish/desktop/StoopidChess.Desktop
            publish/desktop/*.dylib
          if-no-files-found: error
          retention-days: 1

  windows:
    name: build + test + publish (windows)
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0    # The full history and the tags: the version comes from them
      # As on the Linux job: %PROGRAMFILES%\dotnet is not writable by the runner's service account.
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.x
      - name: Build solution
        run: dotnet build StoopidChess.slnx -c Release
      - name: Test
        run: dotnet test tests/StoopidChess.Tests/StoopidChess.Tests.csproj -c Release --no-build
      - name: Publish GUI
        run: dotnet publish src/StoopidChess.Gui/StoopidChess.Gui.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/gui
      - name: Publish engine
        run: dotnet publish src/StoopidChess.Uci/StoopidChess.Uci.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/engine
      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: stoopid-chess-win-x64
          path: |
            publish/gui/StoopidChess.exe
            publish/engine/stoopid-chess.exe
          if-no-files-found: error
          retention-days: 1
